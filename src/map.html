<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Places - Miller Family Tree</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
	html, body { height: 100%; margin: 0; }
	body {
		display: flex;
		flex-direction: column;
		background: #000;
		color: #fff;
		font-family: Verdana, Geneva, sans-serif;
		font-size: .85rem;
	}
	header {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		gap: .6rem 1.2rem;
		padding: .6rem 1rem;
	}
	header h1 { font-size: 1.1rem; margin: 0; }
	header a { color: #fff; }
	header select { font: inherit; padding: .2rem; }
	#count { opacity: .75; }
	#map { flex: 1; min-height: 0; }

	#legend { display: flex; gap: .9rem; }
	#legend span { display: inline-flex; align-items: center; gap: .3rem; }
	#legend i {
		display: inline-block;
		width: .8rem;
		height: .8rem;
		border-radius: 50%;
		border: 1px solid rgba(255, 255, 255, .8);
	}

	/* a dot drawn as a pie: one slice of colour per kind of event at that spot */
	.pie span {
		display: block;
		width: 100%;
		height: 100%;
		border-radius: 50%;
		border: 1.5px solid #111;
		box-sizing: border-box;
		box-shadow: 0 0 0 1px rgba(255, 255, 255, .7);
	}

	/* the navigation pad, the same as on the tree page */
	.map-pad {
		display: grid;
		grid-template-columns: repeat(3, auto);
		justify-items: center;
		cursor: default;
	}
	.map-pad button {
		width: 28px;
		height: 28px;
		margin: 2px;
		padding: 0;
		display: flex;
		align-items: center;
		justify-content: center;
		background: #fff;
		border: none;
		cursor: pointer;
	}
	.map-pad button.below-pad { margin-top: 12px; }
	.map-pad button:hover { background: #222; }
	.map-pad button:focus-visible { outline: 2px solid #045FB4; outline-offset: 1px; }
	.map-pad svg {
		width: 26px;
		height: 26px;
		stroke: #222;
		stroke-width: 1.6;
		stroke-linecap: round;
		fill: none;
		border: 1px solid #222;
	}
	.map-pad svg:hover { stroke: #fff; }

	.leaflet-popup-content { max-height: 16rem; overflow-y: auto; font-size: .8rem; }
	.leaflet-popup-content h3 { margin: 0 0 .3rem; font-size: .9rem; }
	.leaflet-popup-content h4 { margin: .6rem 0 .1rem; font-size: .8rem; }
	.leaflet-popup-content ul { margin: 0; padding-left: 1.1rem; }
</style>
</head>
<body>
<header>
	<h1>Places</h1>
	<a href="/">Back to the tree</a>
	<label>Show
		<select id="filter">
			<option value="all">everything</option>
			<option value="born">births</option>
			<option value="died">deaths</option>
			<option value="buried">burials</option>
			<option value="married">marriages</option>
		</select>
	</label>
	<span id="legend"></span>
	<span id="count"></span>
</header>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
	'use strict';

	var LABELS = { born: 'Born here', married: 'Married here', died: 'Died here', buried: 'Buried here' };
	var ORDER = ['born', 'married', 'died', 'buried'];

	// One colour per kind of event. These are picked to stay apart for most
	// kinds of colour blindness; change them here and the key follows.
	var COLOURS = { born: '#009E73', married: '#E69F00', died: '#CC79A7', buried: '#0072B2' };
	var NAMES = { born: 'Born', married: 'Married', died: 'Died', buried: 'Buried' };

	var map = L.map('map', { worldCopyJump: true, zoomControl: false }).setView([30, -20], 2);
	L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
	}).addTo(map);

	var markers = L.layerGroup().addTo(map);
	var events = [];
	var shownPoints = [];   // the places currently on the map, for the starting view
	var filterBox = document.getElementById('filter');
	var count = document.getElementById('count');

	function esc(value) {
		return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
			return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
		});
	}

	/** One entry per spot on the map, however many events happened there. */
	function groupByPlace(list) {
		var spots = {};
		list.forEach(function (e) {
			var key = e.lat.toFixed(4) + ',' + e.lng.toFixed(4);
			if (!spots[key]) spots[key] = { lat: e.lat, lng: e.lng, events: [] };
			spots[key].events.push(e);
		});
		return Object.keys(spots).map(function (key) { return spots[key]; });
	}

	/** A conic gradient with a slice for each kind of event, sized by how many. */
	function pieFor(spot) {
		var total = spot.events.length;
		var used = 0;
		var slices = [];
		ORDER.forEach(function (kind) {
			var n = spot.events.filter(function (e) { return e.kind === kind; }).length;
			if (!n) return;
			var from = used / total * 100;
			used += n;
			slices.push(COLOURS[kind] + ' ' + from.toFixed(2) + '% ' + (used / total * 100).toFixed(2) + '%');
		});
		return 'conic-gradient(' + slices.join(', ') + ')';
	}

	function popupFor(spot) {
		// the names typed for a spot can differ; the first one stands for it
		var title = spot.events.map(function (e) { return e.place; }).filter(Boolean)[0]
			|| 'Unnamed place';
		var html = '<h3>' + esc(title) + '</h3>';

		ORDER.forEach(function (kind) {
			var here = spot.events.filter(function (e) { return e.kind === kind; });
			if (!here.length) return;
			html += '<h4>' + LABELS[kind] + '</h4><ul>' + here.map(function (e) {
				var dated = e.date && !/^unknown$/i.test(e.date);
				return '<li>' + esc(e.name) + (dated ? ' (' + esc(e.date) + ')' : '') + '</li>';
			}).join('') + '</ul>';
		});
		return html;
	}

	function draw() {
		var kind = filterBox.value;
		var shown = events.filter(function (e) { return kind === 'all' || e.kind === kind; });
		var spots = groupByPlace(shown);

		markers.clearLayers();
		spots.forEach(function (spot) {
			var size = 2 * (6 + Math.min(14, Math.sqrt(spot.events.length) * 3));
			L.marker([spot.lat, spot.lng], {
				icon: L.divIcon({
					className: 'pie',
					html: '<span style="background:' + pieFor(spot) + '"></span>',
					iconSize: [size, size],
					popupAnchor: [0, -size / 2]
				}),
				// smaller dots sit above larger ones, so none is buried underneath
				zIndexOffset: Math.round(1000 - size)
			}).bindPopup(popupFor(spot)).addTo(markers);
		});

		if (!spots.length) {
			shownPoints = [];
			count.textContent = events.length
				? 'Nothing of that kind has coordinates yet.'
				: 'No places have coordinates yet. Add them from a person\u2019s page in the admin.';
			return;
		}

		count.textContent = spots.length + (spots.length === 1 ? ' place, ' : ' places, ')
			+ shown.length + (shown.length === 1 ? ' event' : ' events');

		shownPoints = spots.map(function (spot) { return [spot.lat, spot.lng]; });
		goHome();
	}

	/** The view you get on loading, or when the filter changes: all the places shown. */
	function goHome() {
		if (!shownPoints.length) {
			map.setView([30, -20], 2);
		} else if (shownPoints.length === 1) {
			map.setView(shownPoints[0], 9);
		} else {
			map.fitBounds(shownPoints, { padding: [40, 40] });
		}
	}

	// ---------- the navigation pad, as on the tree page ----------

	// Arrow speed while held: gentle at first, full speed after about a second,
	// in pixels per frame, then a coast to a stop on release.
	var PAN_START = 4;
	var PAN_TOP = 34;
	var PAN_RAMP = 1000;
	var PAN_GLIDE = 0.88;

	var CONTROLS = [
		{ label: 'Scroll up (hold to go further)', icon: 'M3 10l5-5 5 5', hold: [0, 1], at: [2, 1] },
		{ label: 'Scroll left (hold to go further)', icon: 'M10 3L5 8l5 5', hold: [1, 0], at: [1, 2] },
		{ label: 'Back to the starting view', icon: 'M8 2v12M2 8h12', circle: true, at: [2, 2],
		  action: function () { goHome(); } },
		{ label: 'Scroll right (hold to go further)', icon: 'M6 3l5 5-5 5', hold: [-1, 0], at: [3, 2] },
		{ label: 'Scroll down (hold to go further)', icon: 'M3 6l5 5 5-5', hold: [0, -1], at: [2, 3] },
		{ label: 'Zoom out', icon: 'M3 8h10', at: [1, 4], action: function () { map.zoomOut(); } },
		{ label: 'Show the whole world', icon: 'M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4', at: [2, 4],
		  action: function () { map.fitWorld(); } },
		{ label: 'Zoom in', icon: 'M8 3v10M3 8h10', at: [3, 4], action: function () { map.zoomIn(); } }
	];

	/** Move the view by a number of screen pixels, the way the tree's panBy does. */
	var panner = {
		panBy: function (dx, dy) {
			// the tree shifts its content; Leaflet moves the view, so the sign flips
			map.panBy([-dx, -dy], { animate: false });
		}
	};

	/** An arrow that pans while held, faster the longer it is held. */
	function addHoldToPan(button, direction) {
		var frame = null;
		var startedAt = 0;
		var speed = 0;
		var gliding = false;

		function step() {
			var ramp = Math.min(1, (Date.now() - startedAt) / PAN_RAMP);
			speed = PAN_START + (PAN_TOP - PAN_START) * ramp * ramp;
			panner.panBy(direction[0] * speed, direction[1] * speed);
			frame = requestAnimationFrame(step);
		}

		// after the button is let go, carry on and slow to a halt
		function glide() {
			speed *= PAN_GLIDE;
			if (speed < 0.4) {
				frame = null;
				gliding = false;
				return;
			}
			panner.panBy(direction[0] * speed, direction[1] * speed);
			frame = requestAnimationFrame(glide);
		}

		function start(event) {
			if (frame !== null && !gliding) return;
			if (frame !== null) cancelAnimationFrame(frame);   // cut a glide short
			event.preventDefault();
			gliding = false;
			startedAt = Date.now();
			step();
		}

		function stop() {
			if (frame === null || gliding) return;
			cancelAnimationFrame(frame);
			gliding = true;
			frame = requestAnimationFrame(glide);
		}

		button.addEventListener('mousedown', start);
		button.addEventListener('touchstart', start, { passive: false });
		['mouseup', 'mouseleave', 'touchend', 'touchcancel', 'blur'].forEach(function (name) {
			button.addEventListener(name, stop);
		});
		window.addEventListener('mouseup', stop);

		// keyboard: space or enter arrives as a click
		button.addEventListener('click', function () {
			if (frame === null) panner.panBy(direction[0] * 60, direction[1] * 60);
		});
	}

	var Pad = L.Control.extend({
		options: { position: 'topleft' },
		onAdd: function () {
			var bar = L.DomUtil.create('div', 'leaflet-control map-pad');
			// presses on the pad must not drag, or double-click zoom, the map beneath
			L.DomEvent.disableClickPropagation(bar);
			L.DomEvent.disableScrollPropagation(bar);

			CONTROLS.forEach(function (control) {
				var button = L.DomUtil.create('button', control.at[1] === 4 ? 'below-pad' : '', bar);
				button.type = 'button';
				button.title = control.label;
				button.setAttribute('aria-label', control.label);
				button.style.gridColumn = control.at[0];
				button.style.gridRow = control.at[1];
				button.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">'
					+ (control.circle ? '<circle cx="8" cy="8" r="5"></circle>' : '')
					+ '<path d="' + control.icon + '"></path></svg>';
				if (control.hold) {
					addHoldToPan(button, control.hold);
				} else {
					button.addEventListener('click', control.action);
				}
			});
			return bar;
		}
	});
	new Pad().addTo(map);

	filterBox.addEventListener('change', draw);

	fetch('/places.json')
		.then(function (response) {
			if (!response.ok) throw new Error(response.status);
			return response.json();
		})
		.then(function (data) {
			events = data;
			draw();
		})
		.catch(function () {
			count.textContent = 'The places could not be loaded.';
		});
})();
</script>
</body>
</html>
