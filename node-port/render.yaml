# Render blueprint: a Node web service and a Postgres database.
#
# SESSION_SECRET is generated by Render and kept out of the repo.
# DATABASE_URL is filled in from the database below.
services:
  - type: web
    name: family-tree
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: family-tree-db
          property: connectionString

databases:
  - name: family-tree-db
    plan: free